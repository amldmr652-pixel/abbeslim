<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#003d15" />
      <stop offset="50%" stop-color="#0a1a0e" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Card -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="138" stroke="rgba(34, 197, 94, 0.4)" stroke-width="4" />

  <!-- Stylized Modern 'A' Emblem -->
  <g filter="url(#glow)">
    <path
      d="M120 380 L238 120 C246 102 266 102 274 120 L392 380"
      stroke="url(#emblemGrad)"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M175 275 H337"
      stroke="#22c55e"
      stroke-width="48"
      stroke-linecap="round"
    />
    <circle cx="256" cy="180" r="28" fill="#ffffff" />
    <circle cx="392" cy="380" r="32" fill="#4ade80" />
  </g>
</svg>
